<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pleasure Pop logo, primary lockup</title>
<desc>A circular badge with a bold italic P monogram on a hot pink to purple gradient, surrounded by small bursting dots, beside a serif wordmark reading Pleasure Pop.</desc>

<defs>
  <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF6FA5"/>
    <stop offset="100%" stop-color="#7B3FF2"/>
  </linearGradient>
</defs>

<circle cx="110" cy="110" r="86" fill="url(#badgeGrad)"/>

<circle cx="30" cy="60" r="7" fill="#FFC845"/>
<circle cx="20" cy="110" r="5" fill="#FF3E7F"/>
<circle cx="34" cy="158" r="6" fill="#7B3FF2"/>
<circle cx="186" cy="56" r="6" fill="#7B3FF2"/>
<circle cx="198" cy="108" r="5" fill="#FFC845"/>
<circle cx="184" cy="160" r="7" fill="#FF3E7F"/>
<circle cx="110" cy="16" r="5" fill="#FF3E7F"/>
<circle cx="110" cy="204" r="5" fill="#FFC845"/>

<text x="110" y="128" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="92" fill="#FFFFFF" text-anchor="middle">P</text>

<text x="238" y="98" font-family="Fraunces, Georgia, serif" font-weight="500" font-size="56" fill="#2B1B3D">Pleasure</text>
<text x="238" y="150" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="42" fill="#FF3E7F">Pop</text>

<text x="240" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#8B7A94">NAIROBI</text>

</svg>
